Section "ServerLayout"
    Identifier  "ToyiumLayout"
    Screen 0    "ToyiumScreen"
    InputDevice "ToyiumMouse" "CorePointer"
EndSection

Section "Module"
    Load "fbdevhw"
    Load "shadow"
    Load "shadowfb"
EndSection

Section "Monitor"
    Identifier  "ToyiumMonitor"
    HorizSync   1.0 - 1000.0
    VertRefresh 1.0 - 1000.0
    Option      "DPMS" "false"
EndSection

Section "Device"
    Identifier  "ToyiumCard"
    Driver      "fbdev"
    Option      "fbdev" "/dev/fb0"
    Option      "ShadowFB" "false"
EndSection

Section "Screen"
    Identifier  "ToyiumScreen"
    Device      "ToyiumCard"
    Monitor     "ToyiumMonitor"
    DefaultDepth 24
    SubSection "Display"
        Depth   24
        Modes   "1024x768"
    EndSubSection
EndSection

Section "InputDevice"
    Identifier  "ToyiumMouse"
    Driver      "mouse"
    Option      "Device" "/dev/input/mice"
    Option      "Protocol" "IMPS/2"
    Option      "ZAxisMapping" "4 5"
EndSection
