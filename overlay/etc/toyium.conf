# Toyium OS — system config
# /etc/toyium.conf

[system]
name = Toyium OS
version = 0.1.0
arch = x86_64
kernel = 6.6.58
variant = tty

[boot]
bootloader = grub2
init = /init
cmdline = console=tty0 console=ttyS0,115200n8

[network]
hostname = toyium
dhcp = udhcpc
interface = eth0

[motd]
enabled = true
fetch = toyium-fetch

