# Toyium OS — GRUB configuration
# BIOS + UEFI hybrid, 64-bit, serial console for QEMU

set timeout=5
set default=0
set gfxpayload=text

# For serial debugging in QEMU -nographic
serial --speed=115200 --unit=0 --word=8 --parity=no --stop=1
terminal_input console serial
terminal_output console serial

menuentry "Toyium OS v0.1.0  (x86_64, TTY)" --class toyium --class gnu-linux --class gnu --class os {
    echo "Loading Toyium OS kernel ..."
    linux /boot/bzImage console=tty0 console=ttyS0,115200n8 ip=dhcp loglevel=3 quiet
    echo "Loading Toyium initramfs ..."
    initrd /boot/initramfs.cpio.gz
}

menuentry "Toyium OS v0.1.0  (Verbose / Debug)" --class toyium {
    echo "Loading Toyium OS (verbose) ..."
    linux /boot/bzImage console=tty0 console=ttyS0,115200n8 loglevel=7
    initrd /boot/initramfs.cpio.gz
}

menuentry "Toyium OS v0.1.0  (Recovery Shell — rdinit=/init)" --class toyium {
    linux /boot/bzImage console=tty0 console=ttyS0,115200n8 rdinit=/init loglevel=7
    initrd /boot/initramfs.cpio.gz
}

menuentry "Reboot" --class reboot {
    reboot
}

menuentry "Halt" --class halt {
    halt
}
